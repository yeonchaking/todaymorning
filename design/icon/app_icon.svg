<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- 배경 (라운드 스퀘어) -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 떠오르는 해 -->
  <circle cx="512" cy="430" r="150" fill="url(#sun)"/>
  <!-- 햇살 -->
  <g stroke="#FFD54F" stroke-width="22" stroke-linecap="round">
    <line x1="512" y1="205" x2="512" y2="250"/>
    <line x1="332" y1="430" x2="287" y2="430"/>
    <line x1="692" y1="430" x2="737" y2="430"/>
    <line x1="375" y1="293" x2="343" y2="261"/>
    <line x1="649" y1="293" x2="681" y2="261"/>
  </g>

  <!-- 버스 -->
  <g>
    <!-- 차체 -->
    <rect x="270" y="500" width="484" height="270" rx="56" fill="url(#busBody)"/>
    <!-- 상단 노선 띠 -->
    <rect x="270" y="500" width="484" height="60" rx="56" fill="#1565C0"/>
    <rect x="270" y="540" width="484" height="22" fill="#1565C0"/>
    <!-- 창문 -->
    <rect x="320" y="590" width="160" height="95" rx="20" fill="#64B5F6"/>
    <rect x="544" y="590" width="160" height="95" rx="20" fill="#64B5F6"/>
    <!-- 하단 라이트 -->
    <rect x="300" y="705" width="60" height="26" rx="13" fill="#FFB300"/>
    <rect x="664" y="705" width="60" height="26" rx="13" fill="#FFB300"/>
    <!-- 바퀴 -->
    <circle cx="360" cy="775" r="52" fill="#0D47A1"/>
    <circle cx="360" cy="775" r="24" fill="#FFFFFF"/>
    <circle cx="664" cy="775" r="52" fill="#0D47A1"/>
    <circle cx="664" cy="775" r="24" fill="#FFFFFF"/>
  </g>
</svg>
